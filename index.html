<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>9月出差行程</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{font-family:Inter,Arial,system-ui,sans-serif;color:#1d2b24;background:#f6f5f0}*{box-sizing:border-box}body{margin:0;background:#f6f5f0}.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100vh;min-height:620px}.map-area{position:relative;min-width:0}.map{height:100%;width:100%;background:#dfeee4}.map-toolbar{position:absolute;z-index:500;top:18px;left:18px;display:flex;gap:8px;flex-wrap:wrap}.map-toolbar button,.leaflet-control-zoom a{border:1px solid #d5ddd6!important;background:#fffdf8;color:#244535;border-radius:10px;box-shadow:0 2px 8px #22352a20;font:500 14px/1 Arial;cursor:pointer}.map-toolbar button{padding:10px 13px}.map-toolbar button.primary{background:#2d7056;color:#fff;border-color:#2d7056}.map-status{position:absolute;z-index:500;left:18px;bottom:18px;max-width:calc(100% - 36px);padding:9px 12px;border-radius:10px;background:#fffdf8e8;color:#64736a;font-size:12px;box-shadow:0 2px 8px #22352a18}.panel{overflow:auto;padding:24px 20px;background:#fffdf8;border-left:1px solid #dde5de}.eyebrow{margin:0 0 7px;color:#2d7056;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.panel h1{margin:0;font-size:28px;font-weight:500;letter-spacing:-.03em}.intro{margin:7px 0 20px;color:#748079}.card{border:1px solid #dfe6df;border-radius:14px;padding:15px;margin-bottom:14px;background:#fffdf8}.card h2{margin:0 0 12px;font-size:16px;font-weight:500}.stop{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;width:100%;padding:10px 8px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;cursor:pointer;color:#23352a}.stop:hover,.stop.active{background:#e3f0e7;border-color:#b9d5c3}.num{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#2d7056;color:#fff;font-size:12px}.stop strong{font-weight:500}.stop small{display:block;margin-top:3px;color:#718078;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date{color:#718078;font-size:12px;white-space:nowrap}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:#718078}.field input,.field textarea{width:100%;padding:10px;border:1px solid #d7e0d8;border-radius:9px;background:#fbfaf6;color:#1d2b24;font:inherit}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px}.btn{padding:9px 11px;border:1px solid #d5ddd6;border-radius:9px;background:#fffdf8;color:#244535;cursor:pointer;font:500 13px Arial}.btn.primary{background:#2d7056;color:#fff;border-color:#2d7056}.gps-box{display:flex;gap:9px;align-items:center;padding:10px 0;color:#66766c;font-size:12px}.gps-dot{width:10px;height:10px;border-radius:50%;background:#267de8;box-shadow:0 0 0 5px #267de822}.leaflet-popup-content-wrapper{border-radius:10px}.leaflet-popup-content{font:14px/1.45 Arial}.leaflet-control-zoom{border:0!important}.leaflet-control-zoom a{width:32px!important;height:32px!important;line-height:30px!important;margin-bottom:4px}.route-label{font-weight:600;color:#244535}.city-label{font-size:11px;color:#52645a;background:#fffdf8dd;border:0;border-radius:4px;padding:2px 4px;box-shadow:0 1px 4px #20352a22}.leaflet-tooltip.city-label:before{display:none}@media(max-width:820px){.app{grid-template-columns:1fr;height:auto;min-height:100vh}.map-area{height:60vh;min-height:450px}.panel{border-left:0;border-top:1px solid #dde5de}.panel h1{font-size:24px}}
  </style>
</head>
<body>
  <div class="app">
    <section class="map-area">
      <div id="map" class="map" aria-label="法国 GPS 行程地图"></div>
      <div class="map-toolbar"><button class="primary" id="locate">⌖ 定位我</button><button id="fit">显示完整路线</button></div>
      <div class="map-status" id="status">地图已加载 · 点击“定位我”允许浏览器使用 GPS</div>
    </section>
    <aside class="panel">
      <p class="eyebrow">France · itinerary planner</p><h1>9月出差行程</h1><p class="intro">真实地图、路线标记和当前位置定位。</p>
      <section class="card"><h2>行程顺序</h2><div id="stops"></div><div style="display:flex;justify-content:space-between;color:#718078;font-size:12px;margin-top:10px;padding-top:10px;border-top:1px solid #dfe6df"><span>4 个地点</span><span>8 天行程</span></div></section>
      <section class="card"><h2 id="detail-title">1. 巴黎</h2><div class="gps-box"><span class="gps-dot"></span><span id="gps-text">尚未开启 GPS 定位</span></div><div class="field"><label for="date">日期</label><input id="date"></div><div class="field"><label for="note">行程补充</label><textarea id="note"></textarea></div><div class="actions"><button class="btn primary" id="save">保存详情</button><button class="btn" id="clear-gps">停止定位</button></div></section>
    </aside>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const places=[
      {id:1,name:'巴黎',lat:48.8566,lng:2.3522,date:'9月12日',note:'客户会议 · 塞纳河左岸散步'},
      {id:2,name:'里昂',lat:45.764,lng:4.8357,date:'9月14日',note:'客户拜访 · 老城与美食市场'},
      {id:3,name:'阿维尼翁',lat:43.9493,lng:4.8055,date:'9月16日',note:'合作方会议 · 普罗旺斯小镇'},
      {id:4,name:'尼斯',lat:43.7102,lng:7.2619,date:'9月19日',note:'客户拜访 · 蔚蓝海岸 · 返程'}
    ];
    const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([46.6,2.4],6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
    L.control.zoom({position:'bottomright'}).addTo(map);
    const route=L.polyline(places.map(p=>[p.lat,p.lng]),{color:'#df7654',weight:5,opacity:.85}).addTo(map);
    const markers=new Map(); let selected=1; let watchId=null; let gpsMarker=null; let gpsAccuracy=null;
    places.forEach(p=>{const m=L.marker([p.lat,p.lng],{title:p.name}).addTo(map).bindPopup(`<strong>${p.id}. ${p.name}</strong><br>${p.date}<br>${p.note}`);m.bindTooltip(p.name,{permanent:true,direction:'top',offset:[0,-15],className:'city-label'});m.on('click',()=>selectPlace(p.id));markers.set(p.id,m)});
    function renderStops(){document.getElementById('stops').innerHTML=places.map(p=>`<button class="stop ${p.id===selected?'active':''}" data-id="${p.id}"><span class="num">${p.id}</span><span><strong>${p.name}</strong><small>${p.note}</small></span><span class="date">${p.date}</span></button>`).join('');document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>selectPlace(Number(b.dataset.id)))}
    function selectPlace(id){selected=id;const p=places.find(x=>x.id===id);document.getElementById('detail-title').textContent=`${p.id}. ${p.name}`;document.getElementById('date').value=p.date;document.getElementById('note').value=p.note;renderStops();markers.get(id).openPopup();map.panTo([p.lat,p.lng])}
    function setStatus(t){document.getElementById('status').textContent=t;document.getElementById('gps-text').textContent=t}
    function updateGps(pos){const {latitude,longitude,accuracy}=pos.coords;const point=[latitude,longitude];if(!gpsMarker){gpsMarker=L.circleMarker(point,{radius:8,color:'#1769d2',weight:3,fillColor:'#3f91ff',fillOpacity:.9}).addTo(map);gpsAccuracy=L.circle(point,{radius:accuracy,color:'#3f91d455',weight:1,fillColor:'#3f91d422',fillOpacity:.2}).addTo(map)}else{gpsMarker.setLatLng(point);gpsAccuracy.setLatLng(point).setRadius(accuracy)}setStatus(`GPS 已定位 · ${latitude.toFixed(5)}, ${longitude.toFixed(5)} · 精度约 ${Math.round(accuracy)}m`);map.setView(point,Math.max(map.getZoom(),12))}
    function startGps(){if(!navigator.geolocation){setStatus('当前浏览器不支持 GPS 定位');return}setStatus('正在请求位置权限…');watchId=navigator.geolocation.watchPosition(updateGps,err=>setStatus(err.code===1?'未允许位置权限，请在浏览器设置中开启':`定位失败：${err.message}`),{enableHighAccuracy:true,maximumAge:10000,timeout:20000})}
    document.getElementById('locate').onclick=startGps;document.getElementById('clear-gps').onclick=()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;if(gpsMarker){map.removeLayer(gpsMarker);map.removeLayer(gpsAccuracy);gpsMarker=null;gpsAccuracy=null}setStatus('已停止 GPS 定位')};document.getElementById('fit').onclick=()=>map.fitBounds(route.getBounds(),{padding:[40,40]});document.getElementById('save').onclick=()=>{const p=places.find(x=>x.id===selected);p.date=document.getElementById('date').value;p.note=document.getElementById('note').value;markers.get(p.id).setPopupContent(`<strong>${p.id}. ${p.name}</strong><br>${p.date}<br>${p.note}`);renderStops()};selectPlace(1);map.fitBounds(route.getBounds(),{padding:[45,45]});
  </script>
</body>
</html>
