<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>9月出差行程</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#20352a;background:#f6f5f0}.app{display:grid;grid-template-columns:1fr 380px;height:100vh}.map-area{position:relative}.map{height:100%}.toolbar{position:absolute;z-index:500;top:16px;left:16px;display:flex;gap:8px}.toolbar button,.btn{border:1px solid #d5ddd6;border-radius:9px;padding:10px 12px;background:#fffdf8;color:#244535;cursor:pointer}.primary{background:#2d7056!important;color:white!important;border-color:#2d7056!important}.status{position:absolute;z-index:500;bottom:16px;left:16px;padding:9px 12px;border-radius:9px;background:#fffdf8e8;color:#65766b}.panel{overflow:auto;padding:22px 18px;background:#fffdf8;border-left:1px solid #dde5de}.panel h1{margin:0 0 6px;font-size:28px;font-weight:500}.eyebrow{color:#2d7056;letter-spacing:.12em;font-size:12px}.intro{color:#748079}.card{border:1px solid #dfe6df;border-radius:13px;padding:14px;margin:14px 0}.card h2{margin:0 0 12px;font-size:17px;font-weight:500}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;color:#718078}.field input,.field textarea{width:100%;padding:10px;border:1px solid #d7e0d8;border-radius:9px;background:#fbfaf6;font:inherit}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.stop{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;width:100%;padding:10px 8px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;cursor:pointer;color:#23352a}.stop.active,.stop:hover{background:#e3f0e7;border-color:#b9d5c3}.num{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#2d7056;color:white}.stop small{display:block;margin-top:3px;color:#718078;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date{color:#718078;font-size:12px;white-space:nowrap}.gps{padding:10px 0;color:#66766c;font-size:12px}.city-label{font-size:11px;color:#52645a;background:#fffdf8dd;border:0;border-radius:4px;padding:2px 4px}.leaflet-control-zoom a{border-radius:8px!important}@media(max-width:820px){.app{grid-template-columns:1fr;height:auto}.map-area{height:58vh;min-height:440px}.panel{border:0;border-top:1px solid #dde5de}}
</style></head>
<body><div class="app"><section class="map-area"><div id="map" class="map"></div><div class="toolbar"><button class="primary" id="locate">⌖ 定位我</button><button id="fit">显示完整路线</button></div><div id="status" class="status">地图已加载 · 可缩放、拖动和搜索地址</div></section>
<aside class="panel"><p class="eyebrow">FRANCE · ITINERARY PLANNER</p><h1>9月出差行程</h1><p class="intro">输入法国的具体地址，即可加入行程路线。</p>
<section class="card"><h2>添加具体地址</h2><div class="field"><label for="address">法国地址、城市或邮编</label><input id="address" placeholder="例如：10 Avenue des Champs-Élysées, Paris"></div><div class="actions"><button class="btn primary" id="add-address">搜索并添加</button></div><p id="address-status" style="color:#718078;font-size:12px"></p></section>
<section class="card"><h2>行程顺序</h2><div id="stops"></div><div id="summary" style="margin-top:10px;padding-top:10px;border-top:1px solid #dfe6df;color:#718078;font-size:12px"></div></section>
<section class="card"><h2 id="detail-title">地点详情</h2><div class="gps" id="gps-text">GPS 尚未开启</div><div class="field"><label for="date">日期</label><input id="date"></div><div class="field"><label for="note">行程补充</label><textarea id="note"></textarea></div><div class="actions"><button class="btn primary" id="save">保存详情</button><button class="btn" id="delete-place">删除地点</button><button class="btn" id="clear-gps">停止定位</button></div></section></aside></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const places=[{name:'巴黎',lat:48.8566,lng:2.3522,date:'9月12日',note:'客户会议 · 塞纳河左岸散步'},{name:'里昂',lat:45.764,lng:4.8357,date:'9月14日',note:'客户拜访 · 老城与美食市场'},{name:'阿维尼翁',lat:43.9493,lng:4.8055,date:'9月16日',note:'合作方会议 · 普罗旺斯小镇'},{name:'尼斯',lat:43.7102,lng:7.2619,date:'9月19日',note:'客户拜访 · 蔚蓝海岸 · 返程'}];
let selected=0,watchId=null,gpsMarker=null,gpsAccuracy=null;const map=L.map('map').setView([46.6,2.4],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);const markers=new Map();const route=L.polyline([],{color:'#df7654',weight:2,dashArray:'8 8',opacity:.9}).addTo(map);
function setStatus(t){document.getElementById('status').textContent=t;document.getElementById('gps-text').textContent=t}function redrawRoute(){route.setLatLngs(places.map(p=>[p.lat,p.lng]));document.getElementById('summary').textContent=places.length+' 个地点 · 顺序路线'}function addMarker(p,i){const m=L.marker([p.lat,p.lng],{title:p.name}).addTo(map).bindPopup('<strong>'+(i+1)+'. '+p.name+'</strong><br>'+p.date+'<br>'+p.note);m.bindTooltip(p.name,{permanent:true,direction:'top',offset:[0,-15],className:'city-label'});m.on('click',()=>selectPlace(i));markers.set(p,m)}
function renderStops(){document.getElementById('stops').innerHTML=places.map((p,i)=>'<button class="stop '+(i===selected?'active':'')+'" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span><strong>'+p.name+'</strong><small>'+p.note+'</small></span><span class="date">'+p.date+'</span></button>').join('');document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>selectPlace(+b.dataset.i));document.getElementById('summary').textContent=places.length+' 个地点 · 顺序路线'}
function selectPlace(i){selected=i;const p=places[i];document.getElementById('detail-title').textContent=(i+1)+'. '+p.name;document.getElementById('date').value=p.date;document.getElementById('note').value=p.note;renderStops();const m=markers.get(p);if(m){m.openPopup();map.panTo([p.lat,p.lng])}}
async function addAddress(){const input=document.getElementById('address'),q=input.value.trim(),msg=document.getElementById('address-status');if(!q){msg.textContent='请先输入地址';return}msg.textContent='正在搜索地址…';try{const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=fr&accept-language=zh-CN&q='+encodeURIComponent(q);const res=await fetch(url,{headers:{Accept:'application/json'}});const data=await res.json();if(!data.length){msg.textContent='没有找到法国地址，请补充城市或邮编';return}const x=data[0],p={name:q,lat:+x.lat,lng:+x.lon,date:'待定',note:'新添加地点 · '+x.display_name};places.push(p);addMarker(p,places.length-1);redrawRoute();renderStops();selectPlace(places.length-1);input.value='';msg.textContent='已添加：'+x.display_name;map.setView([p.lat,p.lng],15)}catch(e){msg.textContent='搜索失败，请检查网络后重试'}}
document.getElementById('add-address').onclick=addAddress;document.getElementById('address').addEventListener('keydown',e=>{if(e.key==='Enter')addAddress()});document.getElementById('fit').onclick=()=>map.fitBounds(route.getBounds(),{padding:[40,40]});document.getElementById('save').onclick=()=>{const p=places[selected];p.date=document.getElementById('date').value;p.note=document.getElementById('note').value;const m=markers.get(p);m.setPopupContent('<strong>'+(selected+1)+'. '+p.name+'</strong><br>'+p.date+'<br>'+p.note);renderStops()};document.getElementById('locate').onclick=()=>{if(!navigator.geolocation){setStatus('当前浏览器不支持 GPS');return}setStatus('正在请求位置权限…');watchId=navigator.geolocation.watchPosition(pos=>{const c=pos.coords,pt=[c.latitude,c.longitude];if(!gpsMarker){gpsMarker=L.circleMarker(pt,{radius:8,color:'#1769d2',weight:3,fillColor:'#3f91ff',fillOpacity:.9}).addTo(map);gpsAccuracy=L.circle(pt,{radius:c.accuracy,color:'#3f91d455',weight:1,fillColor:'#3f91d422',fillOpacity:.2}).addTo(map)}else{gpsMarker.setLatLng(pt);gpsAccuracy.setLatLng(pt).setRadius(c.accuracy)}setStatus('GPS 已定位 · 精度约 '+Math.round(c.accuracy)+'m');map.setView(pt,Math.max(map.getZoom(),12))},e=>setStatus(e.code===1?'未允许位置权限，请在浏览器设置中开启':'定位失败：'+e.message),{enableHighAccuracy:true,maximumAge:10000,timeout:20000})};document.getElementById('clear-gps').onclick=()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;if(gpsMarker){map.removeLayer(gpsMarker);map.removeLayer(gpsAccuracy);gpsMarker=gpsAccuracy=null}setStatus('已停止 GPS 定位')};places.forEach(addMarker);redrawRoute();renderStops();selectPlace(0);map.fitBounds(route.getBounds(),{padding:[45,45]});
document.getElementById('delete-place').onclick=()=>{if(places.length<=1){setStatus('至少保留一个地点');return}const p=places[selected],m=markers.get(p);if(m)map.removeLayer(m);markers.delete(p);places.splice(selected,1);selected=Math.max(0,selected-1);redrawRoute();renderStops();selectPlace(selected)};</script></body></html>
